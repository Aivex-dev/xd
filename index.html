<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER GEAR — Магазин</title>
  <style>
:root {
  --bg: #1c1c24;          /* графітовий фон */
  --bg-panel: #26262f;    /* темно-сірі панелі */
  --black: #08080c;       /* глибокий чорний */
  --purple: #a855f7;
  --pink: #ff2d95;
  --green: #2bff88;
  --text: #f2f2f7;
  --muted: #8d8d9a;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", Arial, sans-serif;
  font-size: 1rem;
}

button { font-family: inherit; cursor: pointer; }


.logo {
  text-decoration: none;
  color: var(--purple);
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: 3px;
  white-space: nowrap;
  text-shadow: 0 0 12px rgba(168, 85, 247, 0.8);
}

.search {
  flex: 1;
  min-width: 0;
  padding: 12px 22px;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--purple);
  border-radius: 999px;
  font-size: 1rem;
  outline: none;
  box-shadow: 0 0 8px rgba(168, 85, 247, 0.35);
  transition: box-shadow 0.2s;
}
.search:focus { box-shadow: 0 0 16px rgba(168, 85, 247, 0.8); }
.search::placeholder { color: var(--muted); }

.lang {
  background: none;
  border: 1px solid #33333f;
  border-radius: 10px;
  padding: 8px 12px;
  color: var(--muted);
  font-weight: 700;
  font-size: 1rem;
  white-space: nowrap;
  transition: all 0.2s;
}
.lang:hover { border-color: var(--green); }
.lang span.on { color: var(--green); text-shadow: 0 0 8px rgba(43, 255, 136, 0.7); }

.user { display: flex; align-items: center; gap: 14px; white-space: nowrap; }

.cart {
  position: relative;
  background: var(--purple);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 10px 16px;
  font-size: 1.1rem;
  box-shadow: 0 0 16px rgba(168, 85, 247, 0.7);
  transition: transform 0.15s;
}
.cart:hover { transform: scale(1.08); }
.cart-count {
  position: absolute;
  top: -8px;
  right: -8px;
  min-width: 22px;
  height: 22px;
  padding: 0 5px;
  border-radius: 11px;
  background: var(--pink);
  color: #fff;
  font-size: 0.75rem;
  font-weight: 800;
  line-height: 22px;
  box-shadow: 0 0 10px rgba(255, 45, 149, 0.8);
}
.cart-count:empty { display: none; }

.avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--bg-panel);
  border: 2px solid var(--pink);
  box-shadow: 0 0 10px rgba(255, 45, 149, 0.6);
}
.balance { color: var(--green); font-weight: 700; }

/* ---------- TOOLBAR (під шапкою) ---------- */
.toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 14px;
}

.filters-btn {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px 16px;
  background: transparent;
  color: var(--text);
  border: 1px solid var(--purple);
  border-radius: 10px;
  font-size: 0.95rem;
  font-weight: 700;
  box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
  transition: all 0.2s;
}
.filters-btn:hover,
.filters-btn.active {
  background: rgba(168, 85, 247, 0.2);
  box-shadow: 0 0 18px rgba(168, 85, 247, 0.8);
}
.filters-btn svg, .view-btn svg { width: 20px; height: 20px; }

.sort { display: flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 600; font-size: 0.9rem; }
.sort select {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--purple);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 0.95rem;
  font-family: inherit;
  outline: none;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
}
.sort select option { background: #1c1c24; color: #f2f2f7; }

.view-btn {
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  color: var(--text);
  border: 1px solid var(--purple);
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
  transition: all 0.2s;
}
.view-btn:hover { background: rgba(168, 85, 247, 0.2); box-shadow: 0 0 18px rgba(168, 85, 247, 0.8); }
.view-btn .ico-grid { display: none; }
.view-btn.is-list .ico-list { display: none; }
.view-btn.is-list .ico-grid { display: block; }

.found { margin-left: auto; color: var(--green); font-weight: 700; text-shadow: 0 0 8px rgba(43, 255, 136, 0.5); }


/* ---------- PRODUCT ROWS ---------- */
.block h2 { margin-bottom: 14px; font-size: 1.6rem; display: flex; align-items: baseline; gap: 12px; }
.tag { font-size: 0.9rem; color: var(--muted); font-weight: 600; }

.row { display: flex; align-items: center; gap: 12px; }

.cards {
  flex: 1;
  min-width: 0;
  display: flex;
  gap: 16px;
  overflow-x: auto;
  scroll-behavior: smooth;
  padding: 8px 4px 14px;
  scrollbar-width: none;           /* Firefox: ховаємо повзунок */
  -ms-overflow-style: none;
}
.cards::-webkit-scrollbar { display: none; } /* Chrome / Safari */

.nothing { flex: 1; padding: 50px 20px; text-align: center; color: var(--muted); font-size: 1.1rem; }

.card {
  flex: 0 0 200px;
  height: 470px;
  background: var(--bg-panel);
  border: 1px solid var(--purple);
  border-radius: 14px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: 0 0 10px rgba(168, 85, 247, 0.35);
  transition: box-shadow 0.2s, transform 0.2s;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 0 22px rgba(168, 85, 247, 0.8);
}
/* порядок у плитці: фото, кнопки, назва, ціна */
.card .photo { order: 1; }
.card .card-buttons { order: 2; }
.card .card-body { order: 3; }
.card .price { order: 4; }
.card .rating { order: 5; }

.photo {
  flex: 1;
  min-height: 0;
  background: #fff;
  border-radius: 10px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.photo img { width: 100%; height: 100%; object-fit: contain; display: block; }

.card-buttons { display: flex; gap: 6px; }
.card-buttons button {
  flex: 1;
  padding: 8px 4px;
  border-radius: 8px;
  font-size: 0.75rem;
  font-weight: 700;
  transition: all 0.2s;
}
.btn-info {
  background: transparent;
  color: var(--purple);
  border: 1px solid var(--purple);
}
.btn-info:hover { background: var(--purple); color: #fff; box-shadow: 0 0 10px var(--purple); }
.btn-buy {
  background: var(--pink);
  color: #fff;
  border: 1px solid var(--pink);
}
.btn-buy:hover { box-shadow: 0 0 12px var(--pink); }
.btn-buy:active { transform: scale(0.94); }

.card-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.name { color: #fff; font-weight: 600; }
.card .name {
  font-size: 0.9rem;
  line-height: 1.3;
  min-height: 2.6em;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  overflow: hidden;
}
.type { color: var(--muted); font-size: 0.78rem; }
.price { color: var(--green); font-weight: 800; text-shadow: 0 0 8px rgba(43, 255, 136, 0.6); white-space: nowrap; }
.card .price { font-size: 1.15rem; }


/* ---------- ОЦІНКА (зірки) ---------- */
.rating { display: flex; align-items: center; gap: 8px; }
.stars {
  --pct: calc(var(--r) / 5 * 100%);
  display: inline-block;
  font-size: 1.1rem;
  letter-spacing: 2px;
  line-height: 1;
  background: linear-gradient(90deg, #ffd23f var(--pct), #4a4a5c var(--pct));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
}
.rate-num { color: var(--text); font-weight: 700; font-size: 0.9rem; }

.slide-arrow { color: var(--purple); font-size: 4.5rem; text-shadow: 0 0 14px rgba(168, 85, 247, 0.8); }

/* ---------- ВІКНО «ПРО ТОВАР» ---------- */
.product-window {
  position: relative;
  width: min(900px, 100%);
  max-height: 94vh;
  overflow-y: auto;
  background: var(--bg);
  border: 1px solid var(--purple);
  border-radius: 18px;
  box-shadow: 0 0 40px rgba(168, 85, 247, 0.7);
  display: flex;
  gap: 26px;
  padding: 26px;
  transform: scale(0.94);
  transition: transform 0.25s;
}
#productOverlay.open .product-window { transform: scale(1); }
.product-photo {
  flex: 1.3;
  min-width: 0;
  aspect-ratio: 1 / 1;
  background: #fff;
  border-radius: 14px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.product-photo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.product-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; justify-content: center; }
.product-info h3 { font-size: 1.6rem; line-height: 1.25; color: #fff; padding-right: 30px; }
.p-meta { color: var(--muted); display: flex; flex-direction: column; gap: 4px; font-size: 0.95rem; }
.product-info .price { font-size: 2rem; }
.product-info .btn-buy {
  padding: 16px;
  border-radius: 12px;
  font-size: 1.1rem;
  font-weight: 800;
  box-shadow: 0 0 18px rgba(255, 45, 149, 0.6);
}
.card .photo { cursor: zoom-in; }
@media (max-width: 720px) {
  .product-window { flex-direction: column; }
  .product-photo { flex: none; width: 100%; }
}

/* ---------- CART MODAL ---------- */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.25s, visibility 0.25s;
}
.overlay.open { opacity: 1; visibility: visible; }

.cart-window {
  position: relative;
  width: min(1050px, 100%);
  height: min(600px, 92vh);
  background: var(--bg);
  border: 1px solid var(--purple);
  border-radius: 18px;
  box-shadow: 0 0 40px rgba(168, 85, 247, 0.7);
  display: flex;
  transform: scale(0.94);
  transition: transform 0.25s;
}
.overlay.open .cart-window { transform: scale(1); }

.close {
  position: absolute;
  top: 10px;
  right: 14px;
  background: none;
  border: none;
  color: var(--pink);
  font-size: 2rem;
  line-height: 1;
  text-shadow: 0 0 10px rgba(255, 45, 149, 0.8);
  z-index: 2;
}
.close:hover { transform: scale(1.2); }

.cart-left, .cart-right {
  min-width: 0;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.cart-left {
  flex: 1.4;
  border-right: 1px solid var(--purple);
  box-shadow: 6px 0 14px -8px rgba(168, 85, 247, 0.8);
}
.cart-right { flex: 1; }
.cart-window h3 { font-size: 1.3rem; color: var(--purple); }

.cart-list {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 4px 6px 4px 4px;
}
.cart-list::-webkit-scrollbar { width: 8px; }
.cart-list::-webkit-scrollbar-thumb { background: var(--purple); border-radius: 4px; }

.cart-item {
  position: relative;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--bg-panel);
  border: 1px solid var(--purple);
  border-radius: 14px;
  padding: 12px 34px 12px 12px;
  box-shadow: 0 0 10px rgba(168, 85, 247, 0.35);
}
.cart-item .photo { flex: 0 0 70px; height: 70px; }
.meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.meta .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.article { color: var(--muted); font-size: 0.8rem; }

.remove {
  position: absolute;
  top: 6px;
  right: 9px;
  background: none;
  border: none;
  color: var(--pink);
  font-size: 1.1rem;
}
.remove:hover { text-shadow: 0 0 8px var(--pink); }

.qty {
  flex: 0 0 64px;
  width: 64px;
  height: 64px;
  background: #121218;
  color: #fff;
  border: 1px solid var(--purple);
  border-radius: 12px;
  font-size: 1.6rem;
  font-weight: 700;
  text-align: center;
  outline: none;
  -moz-appearance: textfield;
}
.qty::-webkit-outer-spin-button,
.qty::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.qty:focus { box-shadow: 0 0 12px rgba(168, 85, 247, 0.8); }

.empty { color: var(--muted); padding: 20px; text-align: center; }

.order-list {
  flex: 1;
  background: #121218;
  border: 1px solid #33333f;
  border-radius: 12px;
  padding: 14px;
  overflow-y: auto;
  line-height: 1.8;
}
.order-list div {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  border-bottom: 1px dashed #33333f;
}
.order-list div span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.order-list div span:last-child { white-space: nowrap; }
.order-list .empty { border: none; display: block; }

.total { font-size: 1.2rem; font-weight: 700; }
.total #total { color: var(--green); text-shadow: 0 0 8px rgba(43, 255, 136, 0.6); }

.checkout {
  padding: 18px;
  background: var(--pink);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 1.2rem;
  font-weight: 800;
  box-shadow: 0 0 20px rgba(255, 45, 149, 0.7);
  transition: transform 0.15s;
}
.checkout:hover { transform: scale(1.03); }

@media (max-width: 760px) {
  .cart-window { flex-direction: column; overflow-y: auto; }
  .cart-left { border-right: none; border-bottom: 1px solid var(--purple); flex: none; height: 360px; }
  .cart-right { flex: none; height: 380px; }
}


/* ---------- КАТАЛОГ: ПАНЕЛЬ ФІЛЬТРІВ ---------- */
.filters {
  width: 310px;
  flex: 0 0 310px;
  align-self: flex-start;
  position: sticky;
  top: 0;
  max-height: 100vh;
  overflow-y: auto;
  background: var(--bg-panel);
  border-right: 1px solid #33333f;
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.filters.hidden { display: none; }
.filters::-webkit-scrollbar { width: 6px; }
.filters::-webkit-scrollbar-thumb { background: var(--purple); border-radius: 3px; }

.filters-head { display: flex; align-items: center; justify-content: space-between; }
.filters-head h3 { font-size: 1.3rem; color: var(--purple); text-shadow: 0 0 10px rgba(168, 85, 247, 0.6); }
.reset-btn {
  padding: 6px 12px;
  background: transparent;
  color: var(--pink);
  border: 1px solid var(--pink);
  border-radius: 8px;
  font-weight: 700;
  font-size: 0.8rem;
  transition: all 0.2s;
}
.reset-btn:hover { background: rgba(255, 45, 149, 0.15); box-shadow: 0 0 12px rgba(255, 45, 149, 0.6); }

.filter-group h4 { margin-bottom: 10px; font-size: 1rem; }
.price-row { display: flex; gap: 10px; }
.price-row input {
  flex: 1;
  min-width: 0;
  padding: 10px 12px;
  background: var(--bg);
  color: var(--text);
  border: 1px solid #44445a;
  border-radius: 10px;
  font-size: 0.95rem;
  font-family: inherit;
  outline: none;
  -moz-appearance: textfield;
}
.price-row input::-webkit-outer-spin-button,
.price-row input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.price-row input:focus { border-color: var(--purple); box-shadow: 0 0 10px rgba(168, 85, 247, 0.6); }
.price-row input::placeholder { color: var(--muted); }

/* ---------- АКОРДЕОН ---------- */
.acc-list { display: flex; flex-direction: column; gap: 10px; }

.acc {
  background: var(--bg);
  border: 1px solid #33333f;
  border-radius: 12px;
  overflow: hidden;
  transition: border-color 0.25s, box-shadow 0.25s;
}
.acc.open { border-color: var(--purple); box-shadow: 0 0 12px rgba(168, 85, 247, 0.45); }

.acc-head {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 13px 14px;
  background: none;
  border: none;
  color: var(--text);
  font-size: 1rem;
  font-weight: 700;
  text-align: left;
  transition: background 0.2s;
}
.acc-head:hover { background: rgba(168, 85, 247, 0.1); }
.acc-name em { font-style: normal; color: var(--muted); font-weight: 600; font-size: 0.85rem; margin-left: 4px; }

/* галочка справа: у закритому стані дивиться вниз, при відкритті розвертається вгору */
.chev {
  flex: 0 0 20px;
  width: 20px;
  height: 20px;
  fill: none;
  stroke: var(--purple);
  stroke-width: 2.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: transform 0.3s ease;
}
.acc.open .chev { transform: rotate(180deg); }

/* плавне розкриття вниз */
.acc-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.3s ease; }
.acc.open .acc-body { grid-template-rows: 1fr; }
.acc-inner { overflow: hidden; min-height: 0; }
.acc-pad { padding: 0 14px 12px; visibility: hidden; transition: visibility 0s 0.3s; }
.acc.open .acc-pad { visibility: visible; transition-delay: 0s; }

.sub h5 {
  margin: 12px 0 4px;
  font-size: 0.78rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.6px;
}
.opt {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 4px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s;
}
.opt:hover { background: rgba(168, 85, 247, 0.12); }
.opt input { width: 17px; height: 17px; accent-color: var(--purple); cursor: pointer; }
.opt em { margin-left: auto; font-style: normal; color: var(--muted); font-size: 0.8rem; }
.opt.off { opacity: 0.4; cursor: not-allowed; }
.opt.off input { cursor: not-allowed; }
.opt.off:hover { background: none; }

.brand-scroll { max-height: 240px; overflow-y: auto; padding-right: 4px; }
.brand-scroll::-webkit-scrollbar { width: 6px; }
.brand-scroll::-webkit-scrollbar-thumb { background: var(--purple); border-radius: 3px; }

/* ---------- КАТАЛОГ: ТОВАРИ ---------- */
.catalog-title { font-size: 1.8rem; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 18px;
}
.grid .card { flex: none; }
.grid .nothing { grid-column: 1 / -1; }

/* режим «список» */
.grid.list-mode { display: flex; flex-direction: column; gap: 12px; }
.grid.list-mode .card {
  height: auto;
  flex-direction: row;
  align-items: center;
  gap: 18px;
  padding: 10px 16px 10px 10px;
}
.grid.list-mode .card > * { order: 0; }
.grid.list-mode .card .photo { flex: 0 0 90px; height: 90px; }
.grid.list-mode .card .card-body { flex: 1; }
.grid.list-mode .card .name { min-height: 0; font-size: 1rem; }
.grid.list-mode .card .price { flex: 0 0 130px; text-align: right; }
.grid.list-mode .card .rating { flex: 0 0 150px; justify-content: center; }
.grid.list-mode .card .card-buttons { flex: 0 0 230px; }
.grid.list-mode .card .card-buttons button { padding: 10px 6px; }






/* =====================================================
   БАЗА: однаковий масштаб і ширина на всіх сторінках
   ===================================================== */
html { overflow-y: scroll; overflow-x: hidden; scrollbar-gutter: stable; -webkit-text-size-adjust: 100%; }
body { overflow-x: visible; }   /* не hidden: інакше position: sticky не працює */
img, svg { max-width: 100%; }
.page { flex: 1; }
.wrap { width: 100%; max-width: 1440px; margin: 0 auto; padding-left: 28px; padding-right: 28px; }

/* ---------- ВЕРХНЯ ПАНЕЛЬ: Магазин / Каталог ---------- */
.topnav { background: #050508; border-bottom: 1px solid #1f1f2a; padding: 12px 0; }
.topnav .wrap { display: flex; justify-content: center; gap: 14px; }
.nav-btn {
  min-width: 170px;
  text-align: center;
  text-decoration: none;
  color: var(--text);
  font-weight: 800;
  font-size: 1.05rem;
  letter-spacing: 1px;
  padding: 12px 28px;
  border: 1px solid #44445a;
  border-radius: 12px;
  transition: all 0.2s;
}
.nav-btn:hover { border-color: var(--purple); box-shadow: 0 0 16px rgba(168, 85, 247, 0.6); transform: translateY(-1px); }
.nav-btn.active {
  background: linear-gradient(120deg, var(--purple), var(--pink));
  border-color: transparent;
  color: #fff;

const xml = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function wrapName(name) {
  const lines = [];
  let cur = '';
  name.split(' ').forEach(w => {
    if (cur && (cur + ' ' + w).length > 20) { lines.push(cur); cur = w; }
    else cur = cur ? cur + ' ' + w : w;
  });
  if (cur) lines.push(cur);
  return lines.slice(0, 3);
}

const norm = s => s.toLowerCase().replace(/["()]/g, ' ').replace(/\s+/g, ' ').trim();

function lev(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}

// Наскільки слово запиту підходить до товару (0 — не підходить)
function tokenScore(tok, p) {
  if (p.words.some(w => w.startsWith(tok))) return 3;
  if (p.search.includes(tok)) return 2;
  if (tok.length >= 5) {                       // допускаємо одруківки: "sairen" -> "seiren"
    const maxd = tok.length >= 8 ? 2 : 1;
    if (p.words.some(w => Math.abs(w.length - tok.length) <= maxd && lev(tok, w) <= maxd)) return 1;
  }
  return 0;
}
function matchScore(p, tokens) {
  let sum = 0;
  for (const t of tokens) {
    const s = tokenScore(t, p);
    if (!s) return 0;                          // усі слова запиту мають знайтись
    sum += s;
  }
  return sum;
}

    cartList.innerHTML = `<div class="empty">${t('empty')}</div>`;
    return;
  }
  cartList.innerHTML = [...cart].map(([id, qty]) => {
    const p = ALL[id], name = esc(pName(p));
    return `
    <div class="cart-item" data-id="${id}">
      <button class="remove" aria-label="Remove">✕</button>
      <div class="photo"><img src="${p.img}" alt="${name}" referrerpolicy="no-referrer" data-id="${p.id}" onerror="this.onerror=null;this.src=ALL[this.dataset.id].fb"></div>
      <div class="meta">
        <span class="name" title="${name}">${name}</span>
        <span class="article">${t('art')} ${p.art}</span>
      </div>
      <input class="qty" type="number" min="1" value="${qty}">
      <span class="price">${fmt(p.price)} ${t('cur')}</span>
    </div>`;
  }).join('');
}

/* Текстовий список справа, сума, лічильник на іконці */
function renderSummary() {
  let sum = 0, count = 0, rows = '';
  cart.forEach((qty, id) => {
    const p = ALL[id];
    sum += p.price * qty;
    count += qty;
    rows += `<div><span>${esc(pName(p))}</span><span>${fmt(p.price)} ${t('cur')} × ${qty}</span></div>`;
  });
  orderList.innerHTML = rows || `<div class="empty">${t('empty')}</div>`;
  totalEl.textContent = `${fmt(sum)} ${t('cur')}`;
  countEl.textContent = count || '';
}

$('cartBtn').addEventListener('click', openCart);
$('closeCart').addEventListener('click', closeCart);
overlay.addEventListener('click', e => { if (e.target === overlay) closeCart(); });

cartList.addEventListener('input', e => {
  if (!e.target.classList.contains('qty')) return;
  cart.set(e.target.closest('.cart-item').dataset.id, Math.max(1, parseInt(e.target.value, 10) || 1));
  saveCart();

});
cartList.addEventListener('change', e => {

cartList.addEventListener('click', e => {

});

/* =====================================================
   ПАНЕЛЬ ФІЛЬТРІВ — однакова на головній і в каталозі
   (цей блок однаковий у index.html і catalog.html)
   Сторінка лише визначає applyFilters(): що перемалювати після зміни.
   ===================================================== */
const PRICE_MAX = Math.ceil(Math.max(...ALL_LIST.map(p => p.price)) / 1000) * 1000;   // верхня межа повзунка
const PRICE_STEP = 100;

const FS = { min: null, max: null, brands: new Set(), link: new Set(), country: new Set(), all: new Set(), open: new Set(), sub: {} };
Object.keys(FILTERS).forEach(k => {
  FS.sub[k] = {};
  FILTERS[k].groups.forEach(g => FS.sub[k][g.key] = new Set());
});

/* Вибрані фільтри зберігаються на час сесії — при переході між сторінками вони лишаються */
function saveFilters() {
  const sub = {};
  Object.keys(FS.sub).forEach(k => { sub[k] = {}; Object.keys(FS.sub[k]).forEach(g => sub[k][g] = [...FS.sub[k][g]]); });
  try {
    sessionStorage.setItem('cg_filters', JSON.stringify({
      min: FS.min, max: FS.max, brands: [...FS.brands], link: [...FS.link], country: [...FS.country],
      all: [...FS.all], open: [...FS.open], sub
    }));
  } catch (e) {}
}
(function loadFilters() {
  try {
    const d = JSON.parse(sessionStorage.getItem('cg_filters') || 'null');
    if (!d) return;
    FS.min = typeof d.min === 'number' ? d.min : null;
    FS.max = typeof d.max === 'number' ? d.max : null;
    ['brands', 'link', 'country', 'all', 'open'].forEach(k => (d[k] || []).forEach(v => FS[k].add(v)));
    Object.keys(FS.sub).forEach(c => Object.keys(FS.sub[c]).forEach(g =>
      (((d.sub || {})[c] || {})[g] || []).forEach(v => FS.sub[c][g].add(v))));
  } catch (e) {}
})();

/* ---- Фільтрація (для будь-якої сторінки) ---- */
const catActive = k => FS.all.has(k) || Object.values(FS.sub[k]).some(s => s.size);

function matchesFilters(p, skip) {      // skip = 'country' — не враховувати країну (для підрахунку списку країн)
  if (FS.min != null && p.price < FS.min) return false;
  if (FS.max != null && p.price > FS.max) return false;
  if (FS.link.size && !p.link.some(v => FS.link.has(v))) return false;
  if (FS.brands.size && !FS.brands.has(p.brand)) return false;
  if (skip !== 'country' && FS.country.size && !FS.country.has(p.country)) return false;
  const active = Object.keys(CATS).filter(catActive);
  if (!active.length) return true;                       // категорії не вибрані — все
  if (!active.includes(p.cat)) return false;
  // усередині категорії: між групами — «І», у межах групи — «АБО»
  return Object.entries(FS.sub[p.cat]).every(([g, set]) => !set.size || p.attrs[g].some(v => set.has(v)));
}

/* ---- Обрані фільтри (чипи) ---- */
let chipList = [];
function activeChips() {
  const chips = [];
  Object.keys(CATS).forEach(k => {
    if (FS.all.has(k)) chips.push({ label: t('cat_' + k), kind: 'all', cat: k });
    FILTERS[k].groups.forEach(g => g.options.forEach(o => {
      if (FS.sub[k][g.key].has(o.v)) chips.push({ label: `${t('cat_' + k)}: ${o[state.lang]}`, kind: 'sub', cat: k, g: g.key, v: o.v });
    }));
  });
  if (FS.min != null || FS.max != null) {
    chips.push({ label: `${t('price')}: ${fmt(FS.min != null ? FS.min : 0)} – ${fmt(FS.max != null ? FS.max : PRICE_MAX)}`, kind: 'price' });
  }
  FS.link.forEach(v => chips.push({ label: t(v), kind: 'link', v }));
  FS.country.forEach(v => chips.push({ label: COUNTRIES[v][state.lang], kind: 'country', v }));
  FS.brands.forEach(v => chips.push({ label: v, kind: 'brand', v }));
  return chips;
}
function renderChips() {
  chipList = activeChips();
  $('chips').innerHTML = chipList.length
    ? chipList.map((c, i) => `<span class="chip">${esc(c.label)}<button type="button" class="chip-x" data-i="${i}" aria-label="Remove">✕</button></span>`).join('')
    : `<span class="chips-empty">${t('chosen_none')}</span>`;
}
function removeChip(c) {
  if (c.kind === 'all') FS.all.delete(c.cat);
  else if (c.kind === 'sub') FS.sub[c.cat][c.g].delete(c.v);
  else if (c.kind === 'price') FS.min = FS.max = null;
  else if (c.kind === 'link') FS.link.delete(c.v);
  else if (c.kind === 'country') FS.country.delete(c.v);
  else if (c.kind === 'brand') FS.brands.delete(c.v);
}

/* ---- Малювання панелі ---- */
const CHEVRON = '<svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';

function optHTML(role, cat, group, value, label, n, checked) {
  return `<label class="opt ${n || checked ? '' : 'off'}">
    <input type="checkbox" data-role="${role}" data-cat="${cat}" data-g="${group}" value="${esc(value)}" ${checked ? 'checked' : ''} ${n || checked ? '' : 'disabled'}>
    <span>${label}</span><em>${n}</em></label>`;
}

/* Країни: показуємо лише ті, де є товари на цій сторінці й за поточних фільтрів */
function countryOptionsHTML() {
  const lang = state.lang, counts = {};
  const pool = typeof pagePool === 'function' ? pagePool() : ALL_LIST;      // які товари взагалі є на сторінці
  pool.filter(p => matchesFilters(p, 'country')).forEach(p => counts[p.country] = (counts[p.country] || 0) + 1);
  FS.country.forEach(c => { if (!counts[c]) counts[c] = 0; });              // вибрану країну лишаємо, щоб її можна було зняти
  const keys = Object.keys(counts).sort((a, b) => COUNTRIES[a][lang].localeCompare(COUNTRIES[b][lang], lang));
  if (!keys.length) return `<div class="chips-empty">${t('nothing')}</div>`;
  return keys.map(c => optHTML('country', '', '', c, COUNTRIES[c][lang], counts[c], FS.country.has(c))).join('');
}
function renderCountries() {
  if ($('countryBox')) $('countryBox').innerHTML = countryOptionsHTML();
}

function buildFilterPanel() {
  const lang = state.lang;

  // категорії — акордеон (клік по назві або по галочці справа розкриває / закриває)
  const cats = Object.keys(CATS).map(key => {
    const list = CATS[key].list;
    const open = FS.open.has(key);
    let body = optHTML('all', key, '', key, t('all_in_cat'), list.length, FS.all.has(key));
    FILTERS[key].groups.forEach(g => {
      body += `<div class="sub"><h5>${g[lang]}</h5>`;
      g.options.forEach(o => {
        const n = list.filter(p => p.attrs[g.key].includes(o.v)).length;
        body += optHTML('sub', key, g.key, o.v, o[lang], n, FS.sub[key][g.key].has(o.v));
      });
      body += '</div>';
    });
    return `
      <div class="acc ${open ? 'open' : ''}" data-acc="${key}">
        <button class="acc-head" type="button" aria-expanded="${open}">
          <span class="acc-name">${t('cat_' + key)} <em>${list.length}</em></span>
          ${CHEVRON}
        </button>
        <div class="acc-body"><div class="acc-inner"><div class="acc-pad">${body}</div></div></div>
      </div>`;
  }).join('');

  // підключення, бренди
  const bc = {};
  ALL_LIST.forEach(p => { bc[p.brand] = (bc[p.brand] || 0) + 1; });
  const links = ['wired', 'wireless'].map(v =>
    optHTML('link', '', '', v, t(v), ALL_LIST.filter(p => p.link.includes(v)).length, FS.link.has(v))).join('');
  const brands = Object.keys(bc).sort((a, b) => a.localeCompare(b))
    .map(b => optHTML('brand', '', '', b, esc(b), bc[b], FS.brands.has(b))).join('');

  $('filters').innerHTML = `
    <div class="chosen">
      <div class="chosen-head"><span class="chosen-title">${t('chosen')}</span><button class="reset-btn" id="resetBtn" type="button">${t('reset')}</button></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="f-block"><h4>${t('categories')}</h4><div class="acc-list" id="accList">${cats}</div></div>
    <div class="f-block">
      <h4>${t('price')}</h4>
      <div class="price-row">
        <input type="number" id="minPrice" min="0" placeholder="${t('min_price')}">
        <input type="number" id="maxPrice" min="0" placeholder="${t('max_price')}">
      </div>
      <div class="range">
        <div class="range-track"></div><div class="range-fill" id="rangeFill"></div>
        <input type="range" id="rangeMin" min="0" max="${PRICE_MAX}" step="${PRICE_STEP}" value="0">
        <input type="range" id="rangeMax" min="0" max="${PRICE_MAX}" step="${PRICE_STEP}" value="${PRICE_MAX}">
      </div>
      <div class="range-scale"><span>0</span><span>${fmt(PRICE_MAX)}</span></div>
    </div>
    <div class="f-block"><h4>${t('country')}</h4><div id="countryBox">${countryOptionsHTML()}</div></div>
    <div class="f-block"><h4>${t('conn_type')}</h4>${links}</div>
    <div class="f-block"><h4>${t('brand')}</h4><div class="brand-scroll">${brands}</div></div>`;
  syncPriceUI();
  renderChips();
}

/* ---- Ціна: поля «мін / макс» + повзунок із двома ручками ---- */
const toNum = v => v === '' ? null : Math.max(0, +v);

function syncPriceUI(skipNumbers) {
  const rMin = $('rangeMin'), rMax = $('rangeMax');
  if (!rMin || !rMax) return;
  const lo = FS.min == null ? 0 : Math.min(FS.min, PRICE_MAX);
  const hi = FS.max == null ? PRICE_MAX : Math.min(FS.max, PRICE_MAX);
  rMin.value = Math.min(lo, hi);
  rMax.value = Math.max(lo, hi);
  $('rangeFill').style.left = (lo / PRICE_MAX * 100) + '%';
  $('rangeFill').style.width = (Math.max(0, hi - lo) / PRICE_MAX * 100) + '%';
  rMin.style.zIndex = lo > PRICE_MAX * 0.9 ? 4 : 2;            // щоб ручку «мін» можна було взяти, коли обидві біля краю
  if (!skipNumbers) {
    $('minPrice').value = FS.min == null ? '' : FS.min;
    $('maxPrice').value = FS.max == null ? '' : FS.max;
  }
}

function onRange(which) {
  let lo = +$('rangeMin').value, hi = +$('rangeMax').value;
  if (hi - lo < PRICE_STEP) { if (which === 'min') lo = hi - PRICE_STEP; else hi = lo + PRICE_STEP; }
  lo = Math.max(0, lo);
  hi = Math.min(PRICE_MAX, Math.max(hi, lo + PRICE_STEP));
  FS.min = lo <= 0 ? null : lo;
  FS.max = hi >= PRICE_MAX ? null : hi;
  syncPriceUI();
}

/* ---- Події панелі (один раз, делегуванням) ---- */
function filtersChanged(rebuild) {
  saveFilters();
  if (rebuild) buildFilterPanel(); else { renderChips(); renderCountries(); }
  applyFilters();                                // визначає сторінка
}

$('filters').addEventListener('click', e => {
  const head = e.target.closest('.acc-head');
  if (head) {
    const acc = head.parentElement;
    const open = !acc.classList.contains('open');
    acc.classList.toggle('open', open);
    head.setAttribute('aria-expanded', open);
    open ? FS.open.add(acc.dataset.acc) : FS.open.delete(acc.dataset.acc);
    saveFilters();
    return;
  }
  const x = e.target.closest('.chip-x');
  if (x) { removeChip(chipList[+x.dataset.i]); filtersChanged(true); return; }
  if (e.target.closest('#resetBtn')) {
    FS.min = FS.max = null;
    FS.brands.clear(); FS.link.clear(); FS.country.clear(); FS.all.clear();
    Object.values(FS.sub).forEach(groups => Object.values(groups).forEach(s => s.clear()));
    filtersChanged(true);
  }
});

$('filters').addEventListener('change', e => {
  const el = e.target;
  if (el.type !== 'checkbox') return;
  const role = el.dataset.role, cat = el.dataset.cat;
  const acc = el.closest('.acc');
  if (role === 'all') {
    if (el.checked) {
      FS.all.add(cat);
      Object.values(FS.sub[cat]).forEach(s => s.clear());
      acc.querySelectorAll('input[data-role="sub"]').forEach(i => i.checked = false);
    } else FS.all.delete(cat);
  } else if (role === 'sub') {
    const set = FS.sub[cat][el.dataset.g];
    el.checked ? set.add(el.value) : set.delete(el.value);
    if (el.checked) {
      FS.all.delete(cat);
      acc.querySelector('input[data-role="all"]').checked = false;
    }
  } else if (role === 'link') {
    el.checked ? FS.link.add(el.value) : FS.link.delete(el.value);
  } else if (role === 'country') {
    el.checked ? FS.country.add(el.value) : FS.country.delete(el.value);
  } else if (role === 'brand') {
    el.checked ? FS.brands.add(el.value) : FS.brands.delete(el.value);
  }
  filtersChanged(false);
});

$('filters').addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'minPrice') { FS.min = toNum(e.target.value); syncPriceUI(true); }
  else if (id === 'maxPrice') { FS.max = toNum(e.target.value); syncPriceUI(true); }
  else if (id === 'rangeMin') onRange('min');
  else if (id === 'rangeMax') onRange('max');
  else return;
  filtersChanged(false);
});


/* =====================================================
   ГОЛОВНА СТОРІНКА (index.html)
   1) слайдер-банер  2) блок «Акції / Суперціна»  3) слайдер категорій
   ===================================================== */

/* ---- 1) Банер-слайдер ---- */
const slides = [...document.querySelectorAll('.slide')];
const heroDots = $('heroDots');
let cur = 0, timer = null;

function showSlide(i) {
  if (!slides.length) return;
  cur = (i + slides.length) % slides.length;
  slides.forEach((s, k) => s.classList.toggle('active', k === cur));
  [...heroDots.children].forEach((d, k) => d.classList.toggle('active', k === cur));
}
function startAuto() {
  clearInterval(timer);
  timer = setInterval(() => showSlide(cur + 1), 6000);   // автоперемикання кожні 6 с
}
heroDots.innerHTML = slides.map((_, i) => `<button type="button" data-i="${i}" aria-label="${i + 1}"></button>`).join('');
heroDots.addEventListener('click', e => {
  const b = e.target.closest('button[data-i]');
  if (b) { showSlide(+b.dataset.i); startAuto(); }
});
$('heroPrev').addEventListener('click', () => { showSlide(cur - 1); startAuto(); });
$('heroNext').addEventListener('click', () => { showSlide(cur + 1); startAuto(); });
showSlide(0);
startAuto();

/* ---- 2) Ряди товарів: Sales і New products ---- */
const ROWS = [
  { key: 'sales', el: $('cardsSales') },
  { key: 'new',   el: $('cardsNew') }
];

// Знижка видна прямо в картках (стара ціна закреслена, нова яскрава), тому окремого блоку-прикладу немає.
// Ці два нові товари теж зі знижкою — щоб у «New products» були і акційна, і звичайна ціна.
const NEW_ON_SALE = ['mice-9', 'keyboards-4'];

function rowList(key) {
  if (key === 'sales') return Object.keys(SALE).filter(id => !NEW_ON_SALE.includes(id)).map(id => ALL[id]);
  const regular = Object.keys(CATS).flatMap(k => CATS[k].list.filter(p => !p.discount).slice(-3));
  return [...NEW_ON_SALE.map(id => ALL[id]), ...regular];     // жоден товар не повторюється в обох рядах
}

function syncPrev(row) {
  const cards = row.querySelector('.cards');
  row.querySelector('.slide-prev').classList.toggle('show', cards.scrollLeft > 8);
}

function renderRows() {
  ROWS.forEach(r => {
    const list = rowList(r.key).filter(matchesFilters);            // панель фільтрів зліва
    r.el.innerHTML = list.length ? list.map(cardHTML).join('') : `<div class="nothing">${t('nothing')}</div>`;
    r.el.scrollLeft = 0;
    syncPrev(r.el.closest('.row'));
  });
}

/* Стрілки рядів */
document.querySelectorAll('.slide-arrow').forEach(btn => {
  btn.addEventListener('click', () => {
    const cards = btn.closest('.row').querySelector('.cards');
    cards.scrollBy({ left: btn.dataset.dir * cards.clientWidth * 0.8, behavior: 'smooth' });
  });
});
document.querySelectorAll('.row').forEach(row => {
  row.querySelector('.cards').addEventListener('scroll', () => syncPrev(row));
});

/* викликається при зміні мови */
function pageRefresh() { buildFilterPanel(); renderRows(); }

/* викликається панеллю фільтрів після кожної зміни */
function applyFilters() { renderRows(); }

/* які товари є на головній (для списку країн): ті, що в рядах Sales і New products */
function pagePool() { return [...new Set([...rowList('sales'), ...rowList('new')])]; }

buildFilterPanel();
renderRows();


/* ---- Плавний перехід між сторінками: згасання → нова сторінка з’являється ---- */
function goTo(url) {
  document.body.classList.add('leaving');
  setTimeout(() => { location.href = url; }, 280);
}
document.addEventListener('click', e => {
  const a = e.target.closest('a[href]');
  if (!a || e.defaultPrevented || e.button || e.ctrlKey || e.metaKey || e.shiftKey || a.target === '_blank') return;
  const href = a.getAttribute('href');
  if (!href || href.startsWith('#') || /^(https?:|mailto:|tel:)/.test(href)) return;   // тільки внутрішні сторінки
  e.preventDefault();
  goTo(href);
});
window.addEventListener('pageshow', () => document.body.classList.remove('leaving'));   // кнопка «Назад» у браузері

  </script>

</body>
